name: Fork nightly (Windows)

# Fork only. Rebases this fork's patches onto the latest upstream main inside the
# runner, cross-builds an unsigned Windows installer on Linux as upstream does, and publishes it as a prerelease
# here. The installed app updates from these releases, because the build takes
# its update feed from GITHUB_REPOSITORY. The rebase is never pushed: GITHUB_TOKEN
# cannot push upstream's workflow changes. A conflict opens an issue instead.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if neither upstream nor the fork changed
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  FORK_BRANCH: fork/main
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git

jobs:
  build:
    if: github.repository != 'pingdotgg/t3code'
    # Upstream cross-builds Windows on Linux; a native Windows build packs extra
    # files and fails the payload file limit.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Rebase onto upstream main
        id: rebase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fork_sha="$(git rev-parse HEAD)"
          git fetch --no-tags "$UPSTREAM_URL" main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if ! git rebase FETCH_HEAD; then
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Skip when nothing changed
        id: changed
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          MARKER: "upstream ${{ steps.rebase.outputs.upstream_sha }} + fork ${{ steps.rebase.outputs.fork_sha }}"
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          body=""
          if [[ -n "$latest" ]]; then
            body="$(gh release view "$latest" --json body --jq .body)"
          fi
          if [[ "$FORCE" != "true" && "$body" == *"$MARKER"* ]]; then
            echo "Release $latest already has $MARKER."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup dependencies
        if: steps.changed.outputs.build == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        if: steps.changed.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        if: steps.changed.outputs.build == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.changed.outputs.build == 'true'
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      # Above upstream's run numbers, so a fork build installs over the same day's official nightly.
      - name: Resolve version
        id: version
        if: steps.changed.outputs.build == 'true'
        shell: bash
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$((100000 + GITHUB_RUN_NUMBER))" \
            --sha "${{ steps.rebase.outputs.upstream_sha }}" \
            --github-output

      - name: Build installer
        if: steps.changed.outputs.build == 'true'
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          set -euo pipefail
          # Production T3 Connect public config, as upstream's preview builds use.
          for name in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            export "T3CODE_$name=$(sed -n "s|^T3CODE_$name=||p" .env.example)"
          done
          node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"
          # Same split as upstream's release: bundle first, then package it.
          vp run build:desktop:bundle
          vp run dist:desktop:artifact \
            --platform win --target nsis --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --skip-build \
            --keep-stage \
            --verbose

      - name: List packaged payload
        if: failure() && steps.changed.outputs.build == 'true'
        shell: bash
        run: |
          for dir in "${TMPDIR:-/tmp}"/t3code-desktop-win-stage-*/app/dist/win-unpacked; do
            echo "== $dir"
            (cd "$dir" && find . -type f | sort)
          done

      - name: Publish prerelease
        if: steps.changed.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FORK_SHA: ${{ steps.rebase.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe release/*.blockmap release/*.yml)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No installer in release/." && ls -la release || true
            exit 1
          fi
          notes="Built from upstream ${UPSTREAM_SHA} + fork ${FORK_SHA}.

          Fork patches:
          $(git log --format='- %s' "${UPSTREAM_SHA}..HEAD")"
          gh release create "$TAG" "${files[@]}" \
            --title "T3 Code Fork ${{ steps.version.outputs.version }}" \
            --notes "$notes" \
            --target "$FORK_SHA" \
            --prerelease

      - name: Report rebase conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Fork patches conflict with upstream"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // ""')"
          body="Rebasing ${FORK_BRANCH} onto upstream ${UPSTREAM_SHA} failed. Rebase it locally and push. Run: ${RUN_URL}"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
